; OutFox preferences that pi/setup.sh sets in ~/.project-outfox/Save/Preferences.ini.
; Only these keys are changed; OutFox fills in everything else on its first run.
[Options]
; Pump mode with this theme, as an arcade in home mode (no coins, no memory cards)
CurrentGame=pump
Theme=Infinitesimal
Language=en
EventMode=1
CoinMode=Home
MemoryCards=0
AutoMapOnJoyChange=1
; 1280x720 full screen at 60 Hz with vsync: the Pi 5 holds 60 FPS here, the
; compositor scales the picture to the screen (display-60hz picks a 60 Hz mode)
DisplayWidth=1280
DisplayHeight=720
DisplayAspectRatio=1.777778
Windowed=0
Vsync=1
RefreshRate=0
VideoRenderers=glad
DisplayColorDepth=32
TextureColorDepth=32
MovieColorDepth=32
; textures stay loaded and the song images are cached in memory: smooth song select
DelayedTextureDelete=1
ImageCache=MidRes
ImageCacheOnDemand=0
FastLoad=1
SongBackgrounds=1
ShowStats=0
; audio sync measured on the reference Pi; recalibrate on other hardware
; (OutFox options, sync / calibration)
GlobalOffsetSeconds=-0.079368

; OutFox keeps the theme, announcer and modifiers of each game here and uses them at
; start, over [Options]: without this section a new install opens OutFox's default theme
[Game-pump]
Announcer=
DefaultModifiers=FailImmediate, Overhead
Theme=Infinitesimal
